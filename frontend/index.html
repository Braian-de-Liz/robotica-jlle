<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0013b0" />
    <meta
      name="description"
      content="Sistema do Campeonato Joinvilense de Robótica: programação, edital, inscrição de equipes, ingressos e avaliação."
    />
    <title>CJR Joinville, Campeonato Joinvilense de Robótica</title>
    <link rel="icon" type="image/png" href="/logo-cjr-64.png" />
    <link rel="apple-touch-icon" href="/logo-cjr-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- VLibras: tradutor oficial do governo federal para Libras (https://vlibras.gov.br).
         "defer" deixa o sistema carregar primeiro; o botão do tradutor aparece na lateral direita. -->
    <script defer src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        if (window.VLibras) new window.VLibras.Widget('https://vlibras.gov.br/app');
      });
    </script>
  </body>
</html>
